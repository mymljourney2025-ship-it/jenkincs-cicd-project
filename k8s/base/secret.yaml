apiVersion: v1
kind: Secret
metadata:
  name: myapp-secret
  namespace: application
  labels:
    app: myapp
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  API_KEY: "CHANGE_ME"
